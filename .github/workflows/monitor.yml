name: iPhone Price Tracker

on:
  schedule:
    # Se ejecutará cada hora (minuto 0)
    - cron: '0 * * * *'
  workflow_dispatch:      # Esto te permite darle al botón "Play" cuando quieras

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargando el código
        uses: actions/checkout@v4

      - name: 2. Configurando Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalando librerías y Navegador
        run: |
          pip install requests playwright
          python -m playwright install chromium --with-deps

      - name: 4. Ejecutando el Rastreador
        # Ya no ponemos la sección "env" con secretos porque están en el .py
        run: python main.py

      - name: 5. Guardar fotos si falla (Opcional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-de-error
          path: "*.png"
          retention-days: 1
