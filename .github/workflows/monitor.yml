name: Rastreador de Precios Horario

on:
  schedule:
    # Se ejecuta al minuto 0 de cada hora
    - cron: '0 * * * *'
  workflow_dispatch: # Esto permite ejecutarlo manualmente desde la web de GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install requests playwright beautifulsoup4
          # Instalamos el navegador necesario para Playwright
          python -m playwright install chromium --with-deps

      - name: Ejecutar script de rastreo
        env:
          # Aquí conectamos los Secretos de GitHub con tu script
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py